<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5fa" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Zenity: conecta tus finanzas en un solo lugar. Prototipo mobile-first con asistente de IA." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zenity" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Sans Flex: la tipografía variable de Gemini (ejes ROND, wdth, wght) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ROND,wdth,wght@0..100,25..151,1..1000&display=swap"
    />
    <!-- Material Symbols Rounded, solo con los iconos usados (equivalente a Google Symbols de Gemini) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_balance,account_balance_wallet,account_tree,add,add_business,add_card,add_link,alternate_email,api,apps,arrow_back,arrow_downward,arrow_drop_down,arrow_forward,arrow_outward,arrow_upward,assignment_return,auto_awesome,autorenew,badge,balance,bar_chart,block,bolt,build,cake,calculate,calendar_month,call,campaign,category,celebration,chat,check,check_circle,checklist,chevron_right,close,cloud_sync,code,confirmation_number,contactless,content_copy,credit_score,dark_mode,database,dataset,delete,description,domain,done,donut_large,download,edit,edit_note,edit_square,email,emoji_events,error,event,event_available,event_repeat,expand_more,fact_check,favorite,forum,forward_to_inbox,group,groups,help,home,id_card,image,info,insights,inventory_2,leaderboard,light,link,link_off,list,local_shipping,location_on,lock,login,logout,manage_search,mark_email_read,menu,menu_book,mic,mic_off,monitoring,more_horiz,notifications,notifications_active,open_in_new,partly_cloudy_day,payments,pending,pending_actions,percent,person,person_add,person_remove,person_search,picture_as_pdf,pin,play_circle,point_of_sale,progress_activity,qr_code_2,query_stats,radio,radio_button_unchecked,receipt,receipt_long,refresh,report,request_quote,resize,restart_alt,rule,savings,schedule,school,search,search_off,send,settings,shopping_bag,skip_next,smartphone,sms,source,speed,star,start,stop,storefront,summarize,support_agent,swap_horiz,switch_account,sync,tab,table,task_alt,thumb_down,thumb_up,timer,toolbar,tour,trending_down,trending_up,tune,undo,unfold_more,upload,upload_file,verified,view_agenda,visibility,visibility_off,wallet,warning,wb_sunny&display=block"
    />
    <title>Zenity</title>
    <script>
      // Tema antes de pintar (claro por defecto; ver src/lib/theme.ts)
      try {
        var p = JSON.parse(localStorage.getItem('zenity.theme') || '"light"')
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0f121a' : '#f3f5fa')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
